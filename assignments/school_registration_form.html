<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Registration Form</title>
</head>
<body>
    <form>
<form method="post" action="/submit">
    <input type="text" placeholder="First Name" required>
    <input type="text" placeholder="Middle Name" required>
    <input type="text" placeholder="Last Name" required>
    <input type="file" placeholder="Upload Photo" required>
    <input type="date" placeholder="Date of Birth" required>
    <select required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>
    <input type="text" placeholder="State of Origin" required>
    <input type="text" placeholder="Local Government Area" required>
    <input type="text" placeholder="Home Address" required>
    <input type="text" placeholder="Parent/Guardian Name" required>
    <input type="text" placeholder="Parent/Guardian Phone Number" required>
    <input type="text" placeholder="Parent/Guardian Email" required>
    <input type="text" placeholder="Previous School" required>
    <input type="text" placeholder="Class Applying For" required>
    <input type="text" placeholder="Medical info" required>
    <input type="checkbox" placeholder="Any other info" required>
    <button type="submit" required>Submit</button>
    <button type="reset">Reset</button>
</form>
</body>
</html>
